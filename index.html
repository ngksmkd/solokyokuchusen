<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うたプリ ソロ曲くじ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        #app-container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            font-size: 1.4em;
            border-bottom: 2px solid #e91e63;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .group-section {
            background: #fdfdfd;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #eee;
        }
        .group-header {
            font-weight: bold;
            border-bottom: 2px solid #ddd;
            margin-bottom: 10px;
            padding-bottom: 5px;
            display: flex;
            align-items: center;
            font-size: 1.1em;
            color: #444;
        }
        .idol-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        label {
            cursor: pointer;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            background: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        input[type="checkbox"] {
            margin-right: 5px;
            transform: scale(1.1);
        }
        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: transform 0.1s;
            color: white;
        }
        button:active { transform: scale(0.95); }
        .btn-draw { background: #e91e63; grid-column: span 2; font-size: 18px; padding: 15px; box-shadow: 0 4px #ad1457; margin-bottom: 5px; }
        .btn-hist { background: #2196f3; box-shadow: 0 4px #1976d2; }
        .btn-reset { background: #9e9e9e; box-shadow: 0 4px #757575; }

        #counter {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #555;
            font-size: 1.1em;
            background: #eee;
            padding: 8px;
            border-radius: 10px;
        }

        /* モーダル共通 */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            backdrop-filter: blur(3px);
        }
        .modal-base {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            box-sizing: border-box;
        }

        /* 結果モーダル */
        #modal {
            width: 85%;
            max-width: 340px;
            padding: 40px 20px;
            border-radius: 25px;
            text-align: center;
            border: 5px solid #fff;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .outline-text {
            text-shadow: 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff, 0 0 8px rgba(0,0,0,0.2);
            font-weight: 900;
            line-height: 1.4;
        }
        
        /* 履歴モーダル */
        #history-modal {
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            padding: 20px;
            background: #fff;
            border-radius: 20px;
            overflow-y: auto;
        }

        .close-btn {
            margin-top: 25px;
            padding: 10px 30px;
            border-radius: 25px;
            border: none;
            background: #fff;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div id="app-container">
    <h2>歌唱曲 抽選システム</h2>
    
    <div id="groups-container"></div>

    <div class="btn-container">
        <button class="btn-draw" onclick="drawSong()">抽選する</button>
        <button class="btn-hist" onclick="showHistory()">履歴</button>
        <button class="btn-reset" onclick="resetApp()">リセット</button>
    </div>

    <div id="counter">残り 0曲 ／ 全 0曲</div>
</div>

<div id="overlay" onclick="closeAllModals()"></div>

<!-- 抽選結果モーダル -->
<div id="modal" class="modal-base">
    <div id="modal-content"></div>
    <button id="modal-close-btn" class="close-btn" onclick="closeModal()">閉じる</button>
</div>

<!-- 履歴モーダル -->
<div id="history-modal" class="modal-base">

    <div id="history-content" style="line-height:2;"></div>
    <div style="text-align:center;">
        <button onclick="closeHistory()" style="background:#444; margin-top:20px; width:100px;">閉じる</button>
    </div>
</div>

const memberColors = {"音也": "#FE3C48", "真斗": "#4D76F2", "那月": "#FFCA2B", "トキヤ": "#9247D8", "レン": "#FF8126", "翔": "#FF7CC2", "セシル": "#A4E263", "嶺二": "#4AC668", "蘭丸": "#CB305F", "藍": "#C5A0E5", "カミュ": "#90E0FB", "瑛一": "#FE3C48", "綺羅": "#4D76F2", "ナギ": "#FFCA2B", "瑛二": "#9247D8", "ヴァン": "#FF8126", "大和": "#FF7CC2", "シオン": "#A4E263"};
const heavensMembers = ["瑛一", "綺羅", "ナギ", "瑛二", "ヴァン", "大和", "シオン"];
const groups = {"ST☆RISH": ["音也", "真斗", "那月", "トキヤ", "レン", "翔", "セシル"], "QUARTET NIGHT": ["嶺二", "蘭丸", "藍", "カミュ"], "HE★VENS": ["瑛一", "綺羅", "ナギ", "瑛二", "ヴァン", "大和", "シオン"]};

let history = [];
let usedIndices = new Set();

const container = document.getElementById('groups-container');

Object.keys(groups).forEach((groupName, index) => {
    const safeId = "group-" + index;
    const section = document.createElement('div');
    section.className = 'group-section';
    section.innerHTML = `
        <div class="group-header">
            <input type="checkbox" id="master-${safeId}" checked onchange="toggleGroup('${safeId}', this.checked)">
            <span>${groupName}</span>
        </div>
        <div class="idol-list" id="list-${safeId}"></div>
    `;
    container.appendChild(section);
    
    const idolList = document.getElementById('list-' + safeId);
    groups[groupName].forEach(idol => {
        const lbl = document.createElement('label');
        lbl.innerHTML = `<input type="checkbox" value="${idol}" checked class="idol-checkbox item-${safeId}" onchange="onCheckChange('${safeId}')"> ${idol}`;
        idolList.appendChild(lbl);
    });
});

function updateCounter() {
    const checkedIdols = Array.from(document.querySelectorAll('.idol-checkbox:checked')).map(cb => cb.value);
    const totalCount = allSongs.filter(song => checkedIdols.includes(song.アイドル)).length;
    const remainingCount = allSongs.filter((song, index) => checkedIdols.includes(song.アイドル) && !usedIndices.has(index)).length;
    document.getElementById('counter').innerText = `残り ${remainingCount}曲 ／ 全 ${totalCount}曲`;
}

function toggleGroup(safeId, isChecked) {
    document.querySelectorAll('.item-' + safeId).forEach(cb => cb.checked = isChecked);
    updateCounter();
}

function onCheckChange(safeId) {
    const cbs = document.querySelectorAll('.item-' + safeId);
    document.getElementById('master-' + safeId).checked = Array.from(cbs).every(cb => cb.checked);
    updateCounter();
}

function drawSong() {
    const checkedIdols = Array.from(document.querySelectorAll('.idol-checkbox:checked')).map(cb => cb.value);
    if (checkedIdols.length === 0) { alert("アイドルを選択してください"); return; }
    const available = allSongs.map((s, i) => ({...s, idx: i})).filter(s => checkedIdols.includes(s.アイドル) && !usedIndices.has(s.idx));
    if (available.length === 0) { alert("対象の曲がすべて抽選済みです。"); return; }
    
    const result = available[Math.floor(Math.random() * available.length)];
    usedIndices.add(result.idx);
    history.push(result);
    
    showResultModal(result);
    updateCounter();
}

function showResultModal(song) {
    const modal = document.getElementById('modal');
    const content = document.getElementById('modal-content');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('modal-close-btn');
    
    const bgColor = memberColors[song.アイドル] || "#ccc";
    const textColor = heavensMembers.includes(song.アイドル) ? "#083E70" : "#333";

    modal.style.backgroundColor = bgColor;
    closeBtn.style.color = textColor;
    content.innerHTML = `
        <div class="outline-text" style="font-size: 28px; margin-bottom: 12px; color:${textColor}">${song.楽曲}</div>
        <div class="outline-text" style="font-size: 22px; margin-bottom: 20px; color:${textColor}">${song.アイドル}</div>
        <div class="outline-text" style="font-size: 18px; color:${textColor}">No: ${song.選曲番号}</div>
    `;
    modal.style.display = 'block';
    overlay.style.display = 'block';
}

function showHistory() {
    const hContent = document.getElementById('history-content');
    if (history.length === 0) {
        hContent.innerHTML = "<p style='text-align:center;'>履歴はありません</p>";
    } else {
        hContent.innerHTML = history.map((s, i) => `<div><b>${i+1}.</b> ${s.楽曲} / ${s.アイドル}</div>`).join('');
    }
    document.getElementById('history-modal').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
}

function resetApp() {
    if (confirm("抽選済みリストをリセットしますか？")) {
        usedIndices.clear();
        history = [];
        updateCounter();
    }
}

function closeModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }
function closeHistory() { document.getElementById('history-modal').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }
function closeAllModals() { closeModal(); closeHistory(); }

updateCounter();
</script>
